name: Release Windows EXE & macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v2.3.0)'
        required: true
        default: 'v2.3.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build SoulsLights.exe
        run: python build_exe.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SoulsLights-Windows-EXE
          path: dist/SoulsLights.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install macOS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt pyinstaller

      - name: Build SoulsLights.app and DMG
        run: python build_mac.py

      - name: Package SoulsLights-macOS-App.zip for Auto-Updater
        run: ditto -c -k --sequesterRsrc --keepParent dist/SoulsLights.app dist/SoulsLights-macOS-App.zip

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoulsLights-macOS-DMG
          path: |
            dist/SoulsLights-macOS.dmg
            dist/SoulsLights-macOS-App.zip

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: SoulsLights-Windows-EXE
          path: release-assets

      - name: Download macOS DMG & App ZIP
        uses: actions/download-artifact@v4
        with:
          name: SoulsLights-macOS-DMG
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: SoulsLights ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
